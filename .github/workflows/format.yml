name: Format Rust

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: format-rust-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    name: Format and commit
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      FORMAT_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORMAT_BRANCH }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit Rust code
        id: format
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet -- '*.rs'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '*.rs'
          git commit -m 'style: format Rust code'
          git push origin "HEAD:refs/heads/${FORMAT_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch validation
      # explicitly so CI and packaging also run on the formatting commit.
      - name: Validate formatting commit
        if: steps.format.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh workflow run ci.yml --ref "$FORMAT_BRANCH"
          if [[ "$FORMAT_BRANCH" == 'master' ]]; then
            gh workflow run publish-crate.yml --ref "$FORMAT_BRANCH"
          fi
